name: Docker Compose CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    # ✅ IMPORTANT: pass GitHub Secrets to Docker Compose
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build

      # ✅ Wait until DB is really ready
      - name: Wait for PostgreSQL
        run: |
          until docker compose exec -T db pg_isready -U $POSTGRES_USER; do
            echo "Waiting for database..."
            sleep 2
          done

      # ✅ Run Prisma migrations
      - name: Run Prisma migrations
        run: docker compose exec -T app npx prisma migrate deploy

      # ✅ Run seed (optional)
      - name: Seed database
        run: docker compose exec -T app npx prisma db seed || echo "No seed script"

      # ✅ Wait for app startup
      - name: Wait for app
        run: sleep 10

      # ✅ API test
      - name: Health check
        run: curl http://localhost:3000/students/991313761V || exit 1

      # ✅ Logs (debugging)
      - name: Show logs
        run: docker compose logs
