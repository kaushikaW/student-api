name: Full Docker CI

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: studentdb
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        run: docker build -t student-api .

      - name: Run app container
        run: |
          docker run -d \
            -p 3000:3000 \
            -e DATABASE_URL=postgresql://postgres:password@host.docker.internal:5432/studentdb \
            --name app student-api
      
      - name: Wait for app startup
        run: sleep 10
      
      - name: Show logs
        run: docker logs app


      - name: Check logs
        run: docker logs app
