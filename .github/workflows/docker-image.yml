name: Docker Compose CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build

      # ✅ Wait until DB is really ready
      - name: Wait for PostgreSQL
        run: |
          until docker compose exec -T db pg_isready -U postgres; do
            echo "Waiting for database..."
            sleep 2
          done

      # ✅ Run migrations
      - name: Run Prisma migrations
        run: docker exec student-api npx prisma migrate deploy

      # ✅ Run seed (optional)
      - name: Seed database
        run: docker exec student-api npx prisma db seed || echo "No seed script"

      # ✅ Wait for app startup
      - name: Wait for app
        run: sleep 10

      # ✅ API test
      - name: Health check
        run: curl http://localhost:3000/students/991313761V || exit 1

      # ✅ Logs (for debugging)
      - name: Show logs
        run: docker compose logs
