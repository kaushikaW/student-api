name: Full Docker CI

on:
  push:
    branches: ["main"]

jobs:
 
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: studentdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Debug APP_CONFIG (safe)
        env:
          APP_CONFIG: ${{ secrets.APP_CONFIG }}
        run: echo "$APP_CONFIG" 
         


      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Seed database (optional)
        run: npx prisma db seed || echo "No seed script"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        run: docker build -t student-api .

      - name: Run app container
        run: |
          docker run -d \
            -p 3000:3000 \
            -e DATABASE_URL=$DATABASE_URL \
            --name app student-api

      - name: Wait for app startup
        run: sleep 10

      - name: Health check
        run: curl http://localhost:3000/students/991313761V || exit 1

      - name: Show logs
        run: docker logs app
